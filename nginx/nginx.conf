server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index solar_dash.html;

    # solar_dash.html, solar_settings.html, and config.html -- served from
    # here as plain static files. None of the three carry site-specific
    # values baked in; they all fetch /api/site at startup instead (see
    # app/webapp.py's get_site()).
    location / {
        try_files $uri $uri/ =404;
    }

    # eg4poll's own config API -- device discovery, read/write the device/
    # site config, and /api/site (MQTT credentials, Influx org/bucket, tz,
    # diagram scale -- everything the three pages used to get from a
    # hand-maintained dashboard/config.js). Internal-only, never published
    # to the host itself. Discovering what's plugged in and editing config
    # are not things that belong on the MQTT bus, hence a real API instead.
    location /api/ {
        proxy_pass http://eg4poll:8081/api/;
        proxy_set_header Host $host;
    }

    # MQTT over websockets -> mosquitto's websocket listener. The dashboard
    # pages connect here rather than to mosquitto directly so they only ever
    # need to know this host, not the broker's.
    location /mqtt {
        proxy_pass http://mosquitto:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # InfluxDB queries, with a bucket-scoped READ-ONLY token injected here,
    # server-side -- never sent to the browser. influx-auth.conf is written
    # by influx/init-read-token.sh; it does not exist until that has run,
    # which is deliberate -- nginx refuses to start rather than proxy queries
    # with no token attached. See docker-compose.yml (nginx depends_on
    # influx-init).
    location /influx/ {
        proxy_pass http://influxdb:8086/;
        include /etc/nginx/shared/influx-auth.conf;
        proxy_set_header Host $host;
    }

    # Grafana, for the dashboard's history graphs -- solar_dash.html embeds
    # panels from it via iframe (see grafana/provisioning/dashboards/). Its
    # own InfluxDB datasource is self-provisioned (grafana/entrypoint.sh),
    # never typed here. Websocket upgrade headers are needed for Grafana's
    # own live-update features, not just static panel embeds.
    location /grafana/ {
        proxy_pass http://grafana:3000/grafana/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
