# eg4poll broker.
#
# Two listeners:
#   1883  plain MQTT -- exposed to the LAN so anything you wire up yourself
#         (Home Assistant, a NAS recording pipeline, another Node-RED
#         instance) can subscribe directly.
#   9001  MQTT over websockets -- internal only (not published to the host).
#         nginx proxies this at /mqtt so the dashboard pages, which speak
#         MQTT from the browser, never need a raw TCP connection.
listener 1883
protocol mqtt

listener 9001
protocol websockets

# Anonymous connections ARE allowed -- but acl_file grants them read-only on
# energy/# and nothing else (see mosquitto/acl's rules with no `user` line,
# which apply to every client, authenticated or not). Writing anything still
# requires a real account: poller and settings are entries in passwd, built
# by the mosquitto-init service from *_MQTT_PASS in .env -- see
# init-passwd.sh. passwd is not itself committed; the hashes live in a
# volume.
allow_anonymous true
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
